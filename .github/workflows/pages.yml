# Deploy the static Noera / ar-names front-end to GitHub Pages on every push to main.
# Requires: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# The site is published exactly as committed (no build step; .nojekyll keeps files as-is).
# actions/upload-pages-artifact excludes .git and .github from the artifact by default.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
